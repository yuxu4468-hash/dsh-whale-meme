name: CI

on:
  push:
    branches: ['**']
  pull_request:

# 只读权限：本工作流不需要写仓库
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是主要使用平台（安装脚本是 PowerShell），Linux 用于确认纯逻辑层没有平台耦合。
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 刻意不跑 npm install：本插件不依赖任何第三方 npm 包。
      # 如果这一步失败，说明有人引入了依赖，应当先讨论设计。
      - name: 确认没有第三方依赖
        shell: bash
        run: |
          deps=$(node -e "const p=require('./package.json');console.log(Object.keys(p.dependencies||{}).length)")
          if [ "$deps" != "0" ]; then
            echo "::error::package.json 声明了 $deps 个 dependencies；本插件不应有运行时依赖"
            exit 1
          fi
          echo "无运行时依赖 ✓"

      # 纯逻辑 + 宿主接线。真实工作区集成测试不在这个仓库里，会自动跳过。
      # 纯逻辑 + 宿主接线 + 新能力 + 回复层。真实工作区集成测试不在这个仓库里，会自动跳过。
      - name: 单元与接线测试
        run: node --test --test-concurrency=1 test/core.test.mjs test/plugin-smoke.test.mjs test/features.test.mjs test/reply.test.mjs test/extensions.test.mjs

      - name: 集成测试（无工作区时自动跳过，不应因此失败）
        run: node --test --test-concurrency=1 test/integration.test.mjs

      - name: 语法检查（所有源码文件都能被解析）
        shell: bash
        run: |
          fail=0
          for f in lib/*.mjs scripts/*.mjs test/*.mjs; do
            if ! node --check "$f"; then echo "::error file=$f::语法错误"; fail=1; fi
          done
          exit $fail

      - name: 技能资产存在且可读
        shell: bash
        run: |
          test -s assets/skill/whale-meme-workflow/SKILL.md
          node --input-type=module -e "
            const { selfCheck } = await import('./lib/index.mjs');
            const c = selfCheck();
            if (!c.skillFileExists) { console.error('技能文件缺失'); process.exit(1); }
            console.log('技能资产 ✓', c.actions.join(', '));
          "

      - name: 插件可被加载并注册（假宿主）
        run: |
          node -e "
            const mod = await import('./lib/index.mjs');
            if (typeof mod.apply !== 'function') { console.error('缺少 apply 导出'); process.exit(1); }
            const seen = [];
            await mod.apply({
              logger: { info(){}, warn(m){ console.error('warn:', m) }, debug(){} },
              tools: { register: d => seen.push('tool:' + d.name) },
              skills: { register: d => seen.push('skill:' + d.name) },
              workspace: { appendInstructions: async () => true },
            }, { root: process.cwd() });
            console.log('注册结果:', seen.join(', '));
            if (!seen.includes('tool:whale_meme')) process.exit(1);
            if (!seen.includes('skill:whale-meme-workflow')) process.exit(1);
          "

      - name: PowerShell 脚本语法检查（仅 Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 这两个脚本带 UTF-8 BOM 是刻意的：PS 5.1 会把无 BOM 的 UTF-8 脚本按 GBK 读，中文注释会变语法错误。
          foreach ($f in @('scripts/install.ps1','scripts/uninstall.ps1')) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $f))
            if (-not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) {
              throw "$f 缺少 UTF-8 BOM，PowerShell 5.1 会读坏中文"
            }
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$f 语法错误：$($errors[0].Message)" }
            Write-Host "$f ✓ BOM 与语法均正常"
          }
